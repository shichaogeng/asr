<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket ASR 测试客户端</title>
    <style>
        body { font-family: sans-serif; }
        #status, #results { margin-top: 10px; padding: 10px; border: 1px solid #ccc; min-height: 50px; white-space: pre-wrap; word-wrap: break-word; }
        #results { background-color: #f9f9f9; }
        button { margin: 5px; }
        label { margin-right: 10px; }
    </style>
</head>
<body>
    <h1>WebSocket ASR 测试客户端</h1>

    <div>
        <label for="serverUrl">服务器地址:</label>
        <input type="text" id="serverUrl" value="ws://localhost:8887" size="30">
    </div>

    <div>
        <label for="audioFile">选择音频文件 (PCM/WAV):</label>
        <input type="file" id="audioFile" accept=".pcm,.wav,audio/*">
    </div>

    <div>
        <button id="connectBtn">连接</button>
        <button id="disconnectBtn" disabled>断开</button>
        <button id="startSendBtn" disabled>开始发送音频</button>
    </div>

    <h2>状态:</h2>
    <div id="status">未连接</div>

    <h2>识别结果:</h2>
    <div id="results"></div>

    <script src="script.js"></script>
</body>
</html>
