# Volcengine ASR Configuration
# 请替换为你的火山引擎 App ID 和 Token
volcengine.asr.appId=your_app_id
volcengine.asr.token=your_token

# ASR服务配置 (与AsrServiceImpl中的@Value注解匹配)
asr.url=wss://openspeech.bytedance.com/api/v3/sauc/bigmodel
asr.appId=${volcengine.asr.appId}
asr.token=${volcengine.asr.token}

# 音频格式配置
asr.audio.sampleRate=16000
asr.audio.sampleSizeInBits=16
asr.audio.channels=1

# WebSocket Server Port (optional, default is 8080)
server.port=8080

# Logging configuration (optional)
logging.level.com.example.asrwebsocket=DEBUG
logging.level.org.springframework.web.socket=INFO
logging.level.okhttp3=INFO

spring.output.ansi.enabled=always
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# WebSocket Server Configuration
websocket.server.port=8887

# Volcano Engine Credentials
# !! 请务必替换为你的真实凭证 !!
# !! 最好使用环境变量或更安全的配置方式 !!
volcano.engine.app.id=3467491207
volcano.engine.token=kPHQMVliZeyYh2fWkiOC-e9eXIeZhCN8

# Spring Boot Actuator (Optional, but useful)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always